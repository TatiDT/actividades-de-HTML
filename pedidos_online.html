<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
        integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/main.css">
    <title>Prueba</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <h1 class="navbar-brand" href="index.html">Restaurante Coinco</h1>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="menu.html">Menu</a>
                <a class="nav-link" href="servicios.html">Servicios</a>
                <a class="nav-link" href="pedidos_online.html">Pedidos Online</a>
            </div>
        </div>
    </nav>

    <main>
        <h3 class="text-center">Descripción de pedido</h3>

        <form>
            <div class="mb-3">

                <label for="text">Nombre:</label>
                <input class="form-control" id="text" name="text" required>

            </div>
            <div class="mb-3">

                <label for="email">Correo:</label>
                <input type="email" class="form-control" id="email" name="email" required>

            </div>

            <div class="mb-3">

                <label for="phone">Teléfono:</label>
                <input type="number" class="form-control" id="phone" name="phone" required>
            </div>

            <div class="mb-3">
                <label for="date">Fecha de entrega:</label>
                <input type="date" class="form-control" id="date" name="date" required>
            </div>

            <div class="mb-3">
                <label for="spicy">Picante</label>
                <select class="form-control" id="spicy" name="spicy" required>
                    <option value="">Seleccione</option>
                    <option value="si">Sí</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="temperature">Temperatura plato</label>
                <input type="radio" name="temperature" id="caliente" value="caliente">
                <label for="caliente">Caliente</label>
                <input type="radio" name="temperature" id="frio" value="frio">
                <label for="frio">Frio</label>
            </div>
            <div class="mb-3">

                <label for="additional">Datos adicionales</label>
                <textarea class="form-control" id="additional" name="additional" required></textarea>

            </div>

            <button type="submit" class="btn btn-primary">Enviar</button>








        </form>

    </main>

    <footer class="footer-simple text-center mt-5">
        <p>Tatiana Abarca Urra</p>
        <a href="https://github.com/TatiDT/actividades-de-HTML" target="_blank">GitHub</a>
    </footer>

</body>

</html>
